<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;background:#0f1115;color:#e3e5e8;font-family:sans-serif}
.app{display:flex;height:100vh}
.servers{width:72px;background:#0c0e12}
.channels{width:240px;background:#1a1d23}
.chat{flex:1;display:flex;flex-direction:column}
.members{width:240px;background:#1a1d23}
.messages{flex:1;overflow:auto;padding:10px}
.msg{display:flex;gap:10px;padding:6px}
.msg:hover{background:#222}
.avatar{width:40px;height:40px;border-radius:50%}
.input{padding:10px}
input{width:100%;padding:10px;background:#2b2f36;border:none;color:white}
.profile{position:fixed;bottom:0;left:72px;width:240px;background:#16181d;padding:10px;display:flex;gap:10px}
.profile img{width:32px;height:32px;border-radius:50%}
.topbar{padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.channel{padding:10px;cursor:pointer}
.channel:hover{background:#333}
</style>
</head>

<body>

<div class="app">

<div class="servers"></div>

<div class="channels" id="channelsPanel"></div>

<div class="chat">
  <div class="topbar">
    <span id="channelName"># general</span>
    <div>
      <button onclick="openAdmin()">⚙️</button>
      <button onclick="openSettings()">👤</button>
    </div>
  </div>

  <div id="messages" class="messages"></div>

  <div class="input">
    <input id="msgInput" placeholder="Сообщение...">
  </div>
</div>

<div class="members" id="members"></div>

</div>

<div class="profile">
  <img id="myAvatar">
  <span id="myName"></span>
</div>

<!-- AUTH -->
<div id="authModal" style="position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center">
  <div style="background:#1e1f22;padding:20px;border-radius:10px">
    <h2 id="authTitle">Вход</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">
    <input id="regName" placeholder="Имя" style="display:none">
    <button onclick="login()">OK</button>
    <p onclick="toggleAuth()">Регистрация</p>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" style="display:none;position:fixed;inset:0;background:#000a">
  <div style="background:#1e1f22;margin:50px auto;padding:20px;width:300px">
    <input id="newName" placeholder="Имя">
    <button onclick="saveSettings()">Сохранить</button>
    <button onclick="logout()">Выйти</button>
  </div>
</div>

<!-- ADMIN -->
<div id="adminPanel" style="display:none;position:fixed;inset:0;background:#0f1115;color:white">
  <canvas id="chart"></canvas>
  <div id="topUsers"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBo9z598gFXbx6hX9pDhz5LGS4Uncx0hDg",
  authDomain: "voidlauncher-bab33.firebaseapp.com",
  projectId: "voidlauncher-bab33"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser, currentUserData={}, currentChannelId="general", isRegister=false;

function toggleAuth(){
  isRegister=!isRegister;
  authTitle.textContent=isRegister?"Регистрация":"Вход";
  regName.style.display=isRegister?"block":"none";
}

window.login=async()=>{
  const e=email.value,p=password.value;

  try{
    if(isRegister){
      const cred=await auth.createUserWithEmailAndPassword(e,p);

      await db.collection("users").doc(cred.user.uid).set({
        displayName:regName.value||"Аноним",
        role:"user",
        msgCount:0
      });

      return;
    }
    await auth.signInWithEmailAndPassword(e,p);
  }catch(err){alert(err.message)}
};

auth.onAuthStateChanged(async user=>{
  if(!user){authModal.style.display="flex";return}
  authModal.style.display="none";

  currentUser=user;

  const ref=db.collection("users").doc(user.uid);
  const snap=await ref.get();

  if(snap.exists) currentUserData=snap.data();

  loadProfile();
  loadMessages();
  loadMembers();
  loadChannels();

  setInterval(()=>ref.set({lastActive:Date.now()},{merge:true}),20000);
});

function loadProfile(){
  myName.textContent=currentUserData.displayName;
}

msgInput.addEventListener("keydown",async e=>{
  if(e.key==="Enter"){
    const text=msgInput.value.trim();
    if(!text) return;

    await db.collection("messages").add({
      text,
      uid:currentUser.uid,
      displayName:currentUserData.displayName,
      channelId:currentChannelId,
      timestamp:new Date()
    });

    await db.collection("users").doc(currentUser.uid).set({
      msgCount:firebase.firestore.FieldValue.increment(1)
    },{merge:true});

    msgInput.value="";
  }
});

function loadMessages(){
  db.collection("messages")
  .where("channelId","==",currentChannelId)
  .orderBy("timestamp")
  .onSnapshot(snap=>{
    messages.innerHTML="";
    snap.forEach(doc=>{
      const m=doc.data();
      messages.innerHTML+=`
      <div class="msg">
        <div><b>${m.displayName}</b><div>${m.text}</div></div>
      </div>`;
    });
  });
}

function loadMembers(){
  db.collection("users").onSnapshot(snap=>{
    members.innerHTML="";
    snap.forEach(doc=>{
      const u=doc.data();
      members.innerHTML+=`<div>${u.displayName}</div>`;
    });
  });
}

function loadChannels(){
  db.collection("channels").onSnapshot(snap=>{
    channelsPanel.innerHTML="";
    snap.forEach(doc=>{
      channelsPanel.innerHTML+=`
      <div class="channel" onclick="switchChannel('${doc.id}')">
      # ${doc.id}
      </div>`;
    });
  });
}

function switchChannel(id){
  currentChannelId=id;
  channelName.textContent="# "+id;
  loadMessages();
}

function openSettings(){settings.style.display="block"}
function saveSettings(){
  db.collection("users").doc(currentUser.uid).set({
    displayName:newName.value
  },{merge:true});
}
function logout(){auth.signOut()}

function openAdmin(){
  adminPanel.style.display="block";
  buildChart();
  loadTop();
}

async function loadTop(){
  const snap=await db.collection("users").orderBy("msgCount","desc").limit(5).get();
  topUsers.innerHTML="";
  snap.forEach(doc=>{
    const u=doc.data();
    topUsers.innerHTML+=`<div>${u.displayName} - ${u.msgCount}</div>`;
  });
}

let chart;
async function buildChart(){
  const snap=await db.collection("messages").get();
  const labels=["Всего"];
  const data=[snap.size];

  const ctx=document.getElementById("chart");

  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{data}]}
  });
}
</script>

</body>
</html>
