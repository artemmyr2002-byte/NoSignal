<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NovaChat</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>

<body>

<!-- AUTH -->
<div id="auth" class="screen">
  <h1>NovaChat</h1>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">

  <button id="loginBtn">Войти</button>
  <button id="registerBtn">Регистрация</button>
  <button id="guestBtn">Гость</button>

  <div id="authError"></div>
</div>

<!-- APP -->
<div id="app" class="screen hidden">

  <div class="topbar">
    <span id="userName">...</span>
    <div>
      <button id="profileBtn">Профиль</button>
      <button id="logoutBtn">Выйти</button>
    </div>
  </div>

</div>

<!-- PROFILE -->
<div id="profileModal" class="modal hidden">
  <div class="box">
    <h3>Профиль</h3>
    <img id="avatar">
    <input id="nameInput" placeholder="Имя">
    <button id="saveProfile">Сохранить</button>
    <button id="closeProfile">✕</button>
  </div>
</div>

<!-- JS (ВАЖНО: порядок) -->
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
