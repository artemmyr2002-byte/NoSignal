<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NovaChat</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">⚡ NovaChat</div>
  <button id="loginBtn" onclick="openAuth()">Войти</button>
</div>

<!-- MAIN -->
<div class="app">

  <div id="chat">
    <div id="messages"></div>

    <div class="inputBar">
      <button onclick="recordVoice()">🎤</button>
      <input id="msgInput" placeholder="Сообщение...">
    </div>
  </div>

</div>

<!-- AUTH MODAL -->
<div id="authModal" class="modal hidden">
  <div class="modalBox">

    <h2>Вход</h2>

    <button onclick="googleLogin()">Google</button>
    <button onclick="anonLogin()">Гость</button>

    <input id="email" placeholder="email">
    <input id="pass" placeholder="password" type="password">

    <button onclick="emailLogin()">Войти по почте</button>

  </div>
</div>

<script src="app.js"></script>

</body>
</html>
