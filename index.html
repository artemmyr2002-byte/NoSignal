<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaChat</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<div id="auth" class="center">
  <h1>NovaChat</h1>
  <button id="guestBtn">Войти как гость</button>
</div>

<div id="app" class="hidden">

  <button id="openProfile">Профиль</button>

</div>

<!-- ПРОФИЛЬ -->
<div id="profileModal" class="modal hidden">
  <div class="box">

    <h3>Профиль</h3>

    <img id="avatar">

    <input id="nameInput" placeholder="Имя">

    <div>
      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=1" class="ava">
      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=2" class="ava">
      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=3" class="ava">
    </div>

    <button id="saveBtn">Сохранить</button>
    <button id="closeBtn">✕</button>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
