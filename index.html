<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="screen">
  <h2>Вход</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">

  <button id="loginBtn">Войти</button>
  <button id="registerBtn">Регистрация</button>
  <button id="guestBtn">Войти как гость</button>

  <div id="error"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- TOP -->
  <div class="top">
    <div id="name">User</div>
    <div>
      <button id="profileBtn">Профиль</button>
      <button id="logoutBtn">Выйти</button>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div id="messages"></div>

    <div class="send">
      <input id="msgInput" placeholder="Сообщение...">
      <button id="sendBtn">➤</button>
    </div>
  </div>
</div>

<!-- PROFILE -->
<div id="profile">
  <div class="modal">
    <h3>Профиль</h3>

    <input id="newName" placeholder="Новое имя">
    <button id="saveName">Сохранить</button>
    <button id="closeProfile">Закрыть</button>
  </div>
</div>

<!-- МЕНЮ СООБЩЕНИЯ -->
<div id="menu" class="menu">
  <button onclick="editMsg()">Изменить</button>
  <button onclick="deleteMsg()">Удалить</button>
</div>

</body>
</html>
