<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>NoSignal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<div id="auth" class="screen">
  <h2>NoSignal</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">
  <button id="loginBtn">Войти</button>
  <button id="registerBtn">Регистрация</button>
  <button id="guestBtn">Гость</button>
</div>

<div id="app" class="hidden">

  <div class="top">
    <div id="name">User</div>
    <div class="top-buttons">
      <button id="profileBtn">Профиль</button>
      <button id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div id="chat">
    <div id="messages"></div>

    <div class="send">
      <input id="msgInput" placeholder="Сообщение...">
      <button id="sendBtn">➤</button>
    </div>
  </div>
</div>

<div id="menu" class="menu">
  <button onclick="editMsg()">Изменить</button>
  <button onclick="deleteMsg()">Удалить</button>
</div>

<script src="js/firebase.js"></script>
<script src="js/app.js"></script>

</body>
</html>
