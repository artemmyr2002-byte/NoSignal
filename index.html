<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaChat</title>

<link rel="stylesheet" href="./style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<div id="auth" class="center">
  <h1>NovaChat</h1>
  <button onclick="googleLogin()">Google</button>
  <button onclick="guestLogin()">Гость</button>
</div>

<div id="app" class="app hidden">

  <div class="sidebar">
    <button onclick="createChat()">+ чат</button>
    <div id="chatList"></div>
  </div>

  <div class="chat">

    <div class="topbar">
      <span id="chatTitle">чат</span>

      <div>
        <button onclick="openProfile()">👤</button>
        <button onclick="logout()">⎋</button>
      </div>
    </div>

    <div id="typingStatus" class="typing hidden">
      <span id="typingName"></span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>

    <div id="messages" class="messages"></div>

    <div class="inputBar">
      <input id="msgInput">
      <button onclick="sendMsg()">➤</button>
    </div>

  </div>
</div>

<!-- профиль -->
<div id="profileModal" class="modal hidden">
  <div class="modalBox">
    <h3>Профиль</h3>

    <img id="avatar">

    <input id="profileName">

    <div class="avatars">
      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=1" onclick="pickAvatar(this.src)">
      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=2" onclick="pickAvatar(this.src)">
      <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=3" onclick="pickAvatar(this.src)">
    </div>

    <button onclick="saveProfile()">сохранить</button>
    <button onclick="closeProfile()">✕</button>
  </div>
</div>

<audio id="msgSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

<script src="./app.js"></script>
</body>
</html>
