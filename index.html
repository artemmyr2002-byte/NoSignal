<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>NoSignal Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- СТИЛИ -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="screen">
  <h2>NoSignal</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">

  <button id="loginBtn">Войти</button>
  <button id="registerBtn">Регистрация</button>
  <button id="guestBtn">Гость</button>

  <div id="error"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="top">
    <div id="name">User</div>
    <div>
      <button id="profileBtn">Профиль</button>
      <button id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div id="chat">
    <div id="messages"></div>

    <div class="send">
      <input id="msgInput" placeholder="Сообщение...">
      <button id="sendBtn">➤</button>
    </div>
  </div>
</div>

<!-- PROFILE -->
<div id="profile">
  <div class="modal">
    <input id="newName" placeholder="Имя">
    <button id="saveName">Сохранить</button>
    <button id="closeProfile">Закрыть</button>
  </div>
</div>

<!-- МЕНЮ -->
<div id="menu" class="menu">
  <button onclick="editMsg()">Изменить</button>
  <button onclick="deleteMsg()">Удалить</button>
</div>

<!-- СКРИПТЫ -->
<script src="firebase.js"></script>
<script src="js/app.js"></script>

</body>
</html>
