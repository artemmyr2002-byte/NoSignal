<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NovaChat PRO</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>

<div id="authScreen" class="center">
  <h2>NovaChat</h2>
  <button onclick="googleLogin()">Войти через Google</button>
  <button onclick="guestLogin()">Продолжить как гость</button>
</div>

<div class="app hidden" id="app">

  <!-- LEFT -->
  <div class="sidebar">
    <button onclick="createChat()">+ Чат</button>
    <div id="chatList"></div>
  </div>

  <!-- CHAT -->
  <div class="chat">

    <div class="topbar">
      <span id="chatTitle">Выбери чат</span>
      <button onclick="logout()">Выйти</button>
    </div>

    <div id="messages" class="messages"></div>

    <div class="inputBar">
      <input id="msgInput" placeholder="Сообщение">
      <button onclick="sendMsg()">➤</button>
    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
