<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NoSignal</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

</head>
<body>

<!-- AUTH -->
<div id="auth" class="screen">
  <h1>NoSignal</h1>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Пароль">

  <button id="loginBtn">Войти</button>
  <button id="registerBtn">Регистрация</button>
  <button id="guestBtn">Гость</button>

  <div id="error"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="top">
    <span id="name">...</span>
    <button id="profileBtn">Профиль</button>
    <button id="logoutBtn">Выйти</button>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div id="messages"></div>

    <div class="send">
      <input id="msgInput" placeholder="Сообщение">
      <button id="sendBtn">➤</button>
    </div>
  </div>

</div>

<!-- PROFILE -->
<div id="profile" class="hidden">
  <div class="modal">
    <h3>Профиль</h3>
    <input id="newName" placeholder="Имя">
    <button id="saveName">Сохранить</button>
    <button id="closeProfile">✕</button>
  </div>
</div>

<script src="js/firebase.js"></script>
<script src="js/app.js"></script>

</body>
</html>
